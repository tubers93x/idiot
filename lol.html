<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>You Are An Idiot!</title>
	<meta name="author" content="youdontknowwhoiam">
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			width: 100%;
			overflow: hidden;
			background-color: #ffffff;
			cursor: default;
			user-select: none;
			-webkit-user-select: none;
		}

		.idiot-container {
			display: flex;
			justify-content: center;
			align-items: center;
			width: 100%;
			height: 100%;
			background-color: #ffffff;
		}

		.idiot-container img {
			height: 100%;
			width: auto;
			max-width: 100%;
			object-fit: contain;
		}
	</style>
</head>
<body>

	<div class="idiot-container">
		<audio id="youare-audio" src="you-are-an-idiot.mp3" loop></audio>
		<img src="yesyouare.png" alt="You Are An Idiot" draggable="false" oncontextmenu="return false;">
	</div>

	<script>
		const audio = document.getElementById('youare-audio');

		document.body.addEventListener('click', () => {
			audio.play().catch(err => {});
			const popup = window.open('lol.html', '_blank', 'width=357,height=330');
			if (popup) {
				popup.opener = null;
			}
		});

		document.addEventListener('contextmenu', event => event.preventDefault());
		document.addEventListener('keydown', function(e) {
			if (e.key === 'F12' || (e.ctrlKey && (e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C') || e.key === 'u' || e.key === 'U'))) {
				e.preventDefault();
				return false;
            }
		});

		// --- LÓGICA DE FÍSICAS DE REBOTE INDEPENDIENTES ---
		const pantallaAncho = window.screen.availWidth;
		const pantallaAlto = window.screen.availHeight;
		const anchoV = 357;
		const altoV = 330;

		let xPos = Math.random() * (pantallaAncho - anchoV);
		let yPos = Math.random() * (pantallaAlto - altoV);
		
		let xOff = Math.random() > 0.5 ? (Math.random() * 8 + 8) : -(Math.random() * 8 + 8);
		let yOff = Math.random() > 0.5 ? (Math.random() * 8 + 8) : -(Math.random() * 8 + 8);
		
		let flagRun = 1;

		function playBall() {
			xPos += xOff;
			yPos += yOff;
			
			if (xPos > pantallaAncho - anchoV) {
				xOff = Math.ceil(-6 * Math.random()) * 5 - 10;
				window.focus();
			}    
			if (xPos < 0) {
				xOff = Math.ceil(7 * Math.random()) * 5 - 10;
				window.focus();
			}
			
			if (yPos > pantallaAlto - altoV) {
				yOff = Math.ceil(-6 * Math.random()) * 5 - 10;
				window.focus();
			} 		
			if (yPos < 0) {
				yOff = Math.ceil(7 * Math.random()) * 5 - 10;
				window.focus();
			}
			
			if (flagRun == 1) {
				window.moveTo(xPos, yPos);
				setTimeout(playBall, 1);
			}
		}

		window.onload = function () {
			flagRun = 1;
			playBall();
			return true;
		}
	</script>
</body>
</html>
