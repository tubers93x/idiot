<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>You Are An Idiot!</title>
    <meta name="author" content="youdontknowwhoiam">
    
    <!-- Meta descripción solicitada restaurada estrictamente -->
    <meta name="description" content="This is the orgional and the best flash video on the 'net. Once found on www.youdontknowwhoiam.org, not found where it belong, right here on ...vThis is the orgional and the best flash video on the 'net. Once found on www.youdontknowwhoiam.org, not found where it belong, right here on ...v">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
        }

        .intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            z-index: 200;
        }

        .play-button-orange {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #ff9e42, #ff3d3d);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(255, 61, 61, 0.3);
            transition: transform 0.2s ease;
        }

        .play-triangle {
            width: 0;
            height: 0;
            border-top: 30px solid transparent;
            border-bottom: 30px solid transparent;
            border-left: 50px solid #ffffff;
            margin-left: 15px; 
        }

        .idiot-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; 
            pointer-events: none;
            z-index: 100;
        }

        .idiot-container img {
            height: 100vh;
            width: auto;
            max-width: 100vw;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio" class="intro-screen">
        <div class="play-button-orange" onclick="iniciarProyecto(event)">
            <div class="play-triangle"></div>
        </div>
    </div>

    <div id="contenido-principal" class="idiot-container">
        <audio id="audio-idiot" src="you-are-an-idiot.mp3" loop></audio>
        <img src="yesyouare.png" alt="You Are An Idiot" draggable="false" oncontextmenu="return false;">
    </div>

    <script>
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const contenidoPrincipal = document.getElementById('contenido-principal');
        const audio = document.getElementById('audio-idiot');
        
        let interactuado = false;

        function iniciarProyecto(e) {
            e.stopPropagation(); 
            if (!interactuado) {
                interactuado = true;
                audio.play().catch(err => console.log(err));
                pantallaInicio.style.display = 'none';
                contenidoPrincipal.style.opacity = '1';
                
                const popup = window.open('lol.html', '_blank', 'width=357,height=330');
                if (popup) {
                    popup.opener = null;
                }
                
                document.body.addEventListener('click', () => {
                    const nextPopup = window.open('lol.html', '_blank', 'width=357,height=330');
                    if (nextPopup) {
                        nextPopup.opener = null;
                    }
                });
            }
        }

        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = 'Are you an idiot?';
        });

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && (e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C') || e.key === 'u' || e.key === 'U'))) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
